  --drawer-dim:#9E93A6;--drawer-text:#E4DDE8;--drawer-strong:#FBF4FA;--drawer-link:#B0A4B8;--drawer-dot:#6F6379;
}
html[data-font="serif"]{
  --font-ui:"Songti SC","STSong","SimSun","Times New Roman",Georgia,serif;
  --font-word:"Songti SC","STSong","SimSun","Times New Roman",Georgia,serif;
}
html[data-font="kai"]{
  --font-ui:"Kaiti SC",STKaiti,KaiTi,"楷体","Noto Serif SC",serif;
  --font-word:"Kaiti SC",STKaiti,KaiTi,"楷体",serif;
}
html[data-font="round"]{
  --font-ui:"Yuanti SC","YouYuan","Hiragino Sans GB","Noto Sans SC",-apple-system,sans-serif;
  --font-word:"Yuanti SC","YouYuan","Hiragino Sans GB",-apple-system,sans-serif;
}
html[data-font="mono"]{
  --font-ui:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --font-word:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font-family:inherit}
h1,h2,p{margin:0}
.app{position:fixed;inset:0;display:flex;flex-direction:column;margin:0 auto;background:var(--paper)}

/* ===== 顶栏 ===== */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:2px;
  padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;
  background:var(--ink);color:var(--paper);
}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--paper)}
.icon-btn:active{background:rgba(255,255,255,.13)}
.brand-logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;margin:0 2px 0 2px}
.titleblock{flex:1;min-width:0;text-align:center}
.titleblock h1{font-size:17px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titleblock p{margin-top:2px;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 主区 ===== */
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 10px 0;gap:6px}
.hint{flex:0 0 auto;font-size:11.5px;color:var(--muted);padding:0 2px;display:flex;justify-content:space-between;gap:8px}
.gridwrap{flex:1;min-height:0;display:flex;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--card)}
.gridscroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.grid{display:grid;gap:1px;background:var(--line);grid-auto-rows:minmax(46px,auto);align-content:start}
.corner{position:sticky;top:0;left:0;z-index:6;background:var(--head)}
.chead{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:46px;width:100%;padding:0 5px 0 10px;background:var(--head);color:var(--text);text-align:left}
.chead:active{background:var(--head-active)}
.chead-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;justify-content:center}
.chead-txt{font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead-grp{font-size:9.5px;font-weight:600;color:var(--accent-deep);letter-spacing:.06em;line-height:1.1;white-space:nowrap}
.chead-ico{width:14px;height:14px;flex:0 0 auto;opacity:.45}
.chead.is-check-head{background:var(--head-2);padding:0 2px;text-align:center}
.chead.is-check-head:active{background:var(--head-active)}
.chead.is-check-head .chead-ico{display:none}
.chead.is-check-head .chead-name{align-items:center;gap:2px}
.chead.is-check-head .chead-txt{font-size:11px}
.rrail{position:sticky;left:0;z-index:4;display:flex;align-items:center;justify-content:center;min-height:46px;width:100%;background:var(--rail);color:var(--rail-dim);font-size:11px;font-variant-numeric:tabular-nums}
.rrail:active{background:var(--rail-active);color:var(--ink)}
.cell{position:relative;background:var(--card)}
.cell input{display:block;width:100%;min-height:46px;border:0;background:transparent;padding:10px 9px;font-size:16px;line-height:1.35;color:var(--ink);outline:none;border-radius:0;min-width:0}
.cell input:focus{background:var(--focus-bg);box-shadow:inset 0 0 0 2px var(--accent)}
.cell.is-word{display:flex;flex-direction:column;justify-content:center;padding:7px 9px 6px;gap:1px}
.cell.is-word input{font-family:var(--font-word);letter-spacing:.01em;min-height:24px;padding:0}
.cell.is-word:focus-within{background:var(--focus-bg);box-shadow:inset 0 0 0 2px var(--accent)}
.cell.is-word input:focus{background:transparent;box-shadow:none}
.ipa{font-size:12px;line-height:1.35;color:var(--ipa);font-family:var(--font-word);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cell.is-meaning{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:9px;font-size:13.5px;line-height:1.35;cursor:pointer}
.cell.is-meaning:active{background:var(--focus-bg)}
.mline{display:flex;gap:4px;align-items:baseline}
.mpos{flex:0 0 auto;font-size:11.5px;font-weight:600;color:var(--accent-deep);font-family:var(--font-word)}
.mtext{min-width:0;overflow-wrap:break-word}
.mempty{color:var(--ghost);font-size:13px}
.cell.is-check{display:flex;align-items:center;justify-content:center}
.chk{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--chk-line);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.chk svg{width:13px;height:13px}
.cell.is-check.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cell.is-check:active{background:var(--focus-bg)}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--veil-bg);color:var(--ghost);letter-spacing:.2em;font-size:12px;box-shadow:inset 2px 0 0 var(--accent-soft)}
.veil:active{background:var(--head-active)}

/* ===== 底部工具条 ===== */
.toolbar{flex:0 0 auto;display:flex;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
.tool{flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:12px;background:var(--card);border:1px solid var(--line-2);font-size:12.5px;font-weight:500;color:var(--text);padding:0 2px}
.tool svg{width:16px;height:16px;flex:0 0 auto;opacity:.75}
.tool:active{background:var(--head-active)}
.tool.is-on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tool.is-on svg{opacity:.9}

/* ===== 空状态 ===== */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 26px calc(60px + env(safe-area-inset-bottom))}
.empty-mark{width:56px;height:56px;color:var(--accent)}
.empty h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:16px}
.empty p{margin-top:9px;font-size:13.5px;color:var(--muted);line-height:1.65;max-width:330px}
.empty-acts{display:flex;gap:10px;margin-top:22px}

.btn{min-height:44px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:active{background:var(--ink-2)}
.btn.ghost{border:1px solid var(--line-2);color:var(--ink);background:transparent}
.btn.ghost:active{background:var(--head-active)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}

/* ===== 抽屉 ===== */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.46);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.is-open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:22;
  background:var(--ink);color:var(--paper);display:flex;flex-direction:column;
  transform:translateX(-102%);transition:transform .26s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 0 44px rgba(0,0,0,.32);
}
.drawer.is-open{transform:none}
.drawer-head{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 18px) 10px 12px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.drawer-logo{width:40px;height:40px;border-radius:10px;flex:0 0 auto;margin-top:2px}
.drawer-head h2{font-size:18px;font-weight:600;letter-spacing:.01em}
.drawer-head p{margin-top:3px;font-size:11.5px;color:var(--drawer-dim)}
.drawer-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 12px}
.cat{margin-bottom:2px}
.cat-line{display:flex;align-items:center}
.cat-row{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 4px 0 10px;border-radius:10px;text-align:left}
.cat-row:active{background:rgba(255,255,255,.07)}
.cat-name{flex:1;min-width:0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-size:11px;color:var(--drawer-dim);flex:0 0 auto}
.chev{width:13px;height:13px;flex:0 0 auto;opacity:.6;transition:transform .2s}
.chev.rot{transform:rotate(90deg)}
.dots{width:40px;min-height:44px;flex:0 0 auto;color:var(--drawer-dim);font-size:15px;letter-spacing:.05em;border-radius:10px}
.dots:active{background:rgba(255,255,255,.09)}
.books{padding:2px 0 8px;margin-left:17px;border-left:1px solid rgba(255,255,255,.11)}
.book-line{display:flex;align-items:center}
.book{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;border-radius:9px;text-align:left}
.book.is-active{background:var(--accent-glow)}
.book-mark{width:5px;height:5px;border-radius:50%;background:var(--drawer-dot);flex:0 0 auto}
.book.is-active .book-mark{background:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.book-name{flex:1;min-width:0;font-size:13.5px;color:var(--drawer-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book.is-active .book-name{color:var(--drawer-strong);font-weight:600}
.book-rows{font-size:11px;color:var(--drawer-dim);flex:0 0 auto}
.books-empty{padding:8px 12px;font-size:12px;color:var(--drawer-dim)}
.addbook{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;font-size:12.5px;color:var(--drawer-link);text-align:left}
.addbook:active{color:var(--accent)}
.drawer-empty{padding:18px 14px;font-size:12.5px;color:var(--drawer-dim);line-height:1.6}
.drawer-foot{flex:0 0 auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.09)}
.foot-note{margin-top:8px;font-size:11px;color:var(--drawer-dim);line-height:1.5}
.install-btn{width:100%;min-height:38px;margin-top:6px;font-size:12.5px;color:var(--drawer-link);text-decoration:underline;text-underline-offset:3px}
.install-btn:active{color:var(--accent)}
.foot-links{display:flex;gap:6px;margin-top:8px}
.foot-links .mini{flex:1;min-width:0;min-height:38px;padding:0 6px;border:1px solid rgba(255,255,255,.16);border-radius:10px;font-size:12px;color:var(--drawer-link);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-links .mini:active{color:var(--accent);border-color:var(--accent)}

/* ===== 底部动作面板 ===== */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(9,17,13,.5);animation:dc-fade .18s ease-out}
.sheet{position:relative;width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;padding:4px 12px calc(12px + env(safe-area-inset-bottom));animation:dc-up .22s cubic-bezier(.22,.61,.36,1)}
.sheet-tall{max-height:88vh;display:flex;flex-direction:column}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:6px auto 2px;flex:0 0 auto}
.sheet-title{font-size:16px;font-weight:600;padding:8px 6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
.sheet-sub{font-size:12.5px;color:var(--muted);padding:2px 6px 4px;flex:0 0 auto}
.sheet-list{margin-top:4px}
.sheet-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:0 8px;border-radius:10px;text-align:left;font-size:15px}
.sheet-item:active{background:var(--head-active)}
.sheet-item.danger .si-label{color:var(--danger)}
.si-label{flex:1;min-width:0}
.si-desc{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.sheet-cancel{width:100%;min-height:48px;margin-top:6px;border-radius:12px;background:var(--head);font-size:14.5px;color:var(--text)}
.sheet-cancel:active{background:var(--head-active)}
.sheet-form{padding:6px 6px 0}
.sheet-input{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink);outline:none}
.sheet-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.sheet-actions .btn{flex:1}
.sheet-input.shake{animation:dc-shake .3s}
.date-row{padding:10px 6px 2px}
.date-input{width:100%;min-height:52px;border:1px solid var(--line-2);border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink);outline:none}
.date-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ebb-remove{width:100%;min-height:44px;margin-top:6px;font-size:13px;color:var(--danger)}
.ebb-remove:active{background:var(--danger-soft)}
.install-guide{padding:6px 2px 12px}
.install-guide p{font-size:13.5px;line-height:1.65;color:#3D4C38;padding:4px 6px}
.install-guide p b{color:var(--accent-deep)}
.set-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 2px 4px}
.set-h{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.1em;padding:10px 8px 8px}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.theme-chip{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);text-align:left}
.theme-chip.is-on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme-chip.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:10px}
.theme-chip.wide .sw{width:56px;flex:0 0 auto;height:24px}
.sw{display:flex;height:28px;border-radius:8px;overflow:hidden}
.sw i{flex:1}
.theme-chip b{font-size:12.5px;font-weight:600;color:var(--text)}
.font-list{display:flex;flex-direction:column;gap:6px}
.font-item{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);text-align:left}
.font-item.is-on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fx{flex:0 0 auto;font-size:16px;color:var(--ink)}
.fname{flex:1;min-width:0;text-align:right;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdot{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--accent);opacity:0}
.font-item.is-on .fdot{opacity:1}
.f-def{font-family:"Iowan Old Style",Charter,Georgia,"Times New Roman",serif}
.f-serif{font-family:"Songti SC","STSong","SimSun","Times New Roman",Georgia,serif}
.f-kai{font-family:"Kaiti SC",STKaiti,KaiTi,"楷体",serif}
.f-round{font-family:"Yuanti SC","YouYuan","Hiragino Sans GB",-apple-system,sans-serif}
.f-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}
.sheet-full{position:fixed;inset:0;max-height:none;border-radius:0;display:block;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:0}
.sheet-full .set-body{overflow:visible}
.done-wrap{position:sticky;bottom:0;margin-top:10px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.theme-chip,.font-item,.done-wrap .btn{touch-action:manipulation}

/* ===== 释义编辑器 ===== */
.ms-scroll{flex:1;min-height:80px;overflow-y:auto;overscroll-behavior:contain;padding:4px 2px 6px}
.ms-row{display:flex;align-items:center;gap:6px;margin:6px 0}
.ms-pos{appearance:none;-webkit-appearance:none;min-width:66px;height:42px;border:1px solid var(--line-2);border-radius:9px;background:#EDF1E2;color:var(--accent-deep);font-size:13px;font-weight:600;text-align:center;padding:0 4px;outline:none}
.ms-input{flex:1;min-width:0;height:42px;border:1px solid var(--line-2);border-radius:10px;padding:0 10px;font-size:16px;background:#fff;color:var(--ink);outline:none}
.ms-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ms-del{width:34px;height:42px;color:#9AA891;font-size:16px;border-radius:8px;flex:0 0 auto}
.ms-del:active{background:#EDF1E2}
.ms-empty{font-size:12.5px;color:var(--muted);padding:8px 4px}
.ms-label{font-size:12px;color:var(--muted);padding:6px 4px 6px;flex:0 0 auto}
.ms-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 8px;flex:0 0 auto;max-height:126px;overflow-y:auto}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;color:#3B4E36;background:var(--rail)}
.chip:active{background:var(--accent-soft);border-color:var(--accent)}
.sheet-foot{padding:6px 2px 0;flex:0 0 auto}

@keyframes dc-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes dc-fade{from{opacity:0}to{opacity:1}}
@keyframes dc-shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,8px);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:820px){
  body{background:#E7EADF}
  .app{max-width:560px;border-left:1px solid var(--line-2);border-right:1px solid var(--line-2)}
  .drawer{left:calc(50% - 280px)}
  .scrim{max-width:560px;margin:0 auto}
  .sheet-wrap{align-items:center}
  .sheet{border-radius:18px;max-width:430px;padding-bottom:12px}
  .sheet-bg{border-radius:18px}
}
@media (prefers-reduced-motion:reduce){
  .drawer,.scrim,.sheet,.sheet-bg,.toast{transition:none;animation:none}
}
/* 隐藏发布平台注入的悬浮水印 */
[data-custom-element="doubao-watermark"]{display:none!important;visibility:hidden!important;pointer-events:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button type="button" class="icon-btn" id="btnMenu" aria-label="打开词库">

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}
function uid(p){ return p+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6); }

/* ===== 释义结构：每行 "词性 意思"，多条用换行分隔 ===== */
var POS_RE=/^\s*(adj|adv|n|v|vt|vi|prep|conj|pron|num|art|int|phr|aux)\.\s*/i;
function parseEntries(str){
  var out=[];
  String(str==null?'':str).split('\n').forEach(function(line){
    var s=line.replace(/\s+$/,'');
    if(!s.trim()) return;
    var m=s.match(POS_RE);
    if(m){
      out.push({pos:m[1].toLowerCase()+'.',text:s.slice(m[0].length).trim()});
    }else{
      out.push({pos:'',text:s.trim()});
    }
  });
  return out;
}
function serializeEntries(list){
  var out=[];
  for(var i=0;i<list.length;i++){
    var t=toStr(list[i].text).trim();
    if(!t) continue;
    out.push((list[i].pos?list[i].pos+' ':'')+t);
  }
  return out.join('\n');
}

    headers:['单词','释义'],
    types:['text','meaning'],
    groups:['',''],

    ebbStart:null,
    rows:rows,v:SCHEMA_V
  };

}

function normalize(raw){
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.cats)) return null;
  var cats=[];
  for(var i=0;i<raw.cats.length;i++){
    var c=raw.cats[i];
    if(!c||typeof c!=='object') continue;
    var books=[];
    var list=Array.isArray(c.books)?c.books:[];
    for(var j=0;j<list.length;j++){
      var b=list[j];
      if(!b||typeof b!=='object') continue;
      var headers=(Array.isArray(b.headers)&&b.headers.length)?b.headers.map(toStr):['单词','释义'];
      if(headers.length>MAX_COLS) headers=headers.slice(0,MAX_COLS);
      var rawRows=Array.isArray(b.rows)?b.rows:[];
      var groups=Array.isArray(b.groups)?b.groups.map(toStr):[];
      var types=Array.isArray(b.types)?b.types.map(function(x){return toStr(x)||'text';}):[];

      /* 旧结构（3 列：单词 / 音标 / 释义）去掉音标列 */
      if((typeof b.v==='undefined'||Number(b.v)<SCHEMA_V) && headers.length===3 && /音标/.test(headers[1]) && /释义|意思/.test(headers[2])){
        headers.splice(1,1);
        var newRows=[];
        for(var q=0;q<rawRows.length;q++){
          var rr=rawRows[q];
          if(Array.isArray(rr)){ newRows.push([rr[0],rr[2]]); }
        }
        rawRows=newRows;
        types=[];
        groups=[];
      }

      if(types.length!==headers.length){
        types=[];
        for(var t=0;t<headers.length;t++){
          types.push(/释义|意思|meaning|中文/i.test(headers[t])?'meaning':'text');
        }
      }
      types=types.slice(0,headers.length);
      for(var t2=0;t2<types.length;t2++){
        if(types[t2]!=='meaning'&&types[t2]!=='check') types[t2]='text';
      }
      if(groups.length!==headers.length){
        groups=[];
        for(var g=0;g<headers.length;g++) groups.push('');
      }
      groups=groups.slice(0,headers.length);

      var ebboff=Array.isArray(b.ebboff)?b.ebboff.slice(0,headers.length):[];
      while(ebboff.length<headers.length) ebboff.push(null);
      for(var e2=0;e2<ebboff.length;e2++){
        if(typeof ebboff[e2]!=='number'||isNaN(ebboff[e2])) ebboff[e2]=null;
      }

      var rows=[];
      for(var r=0;r<rawRows.length&&r<MAX_ROWS;r++){
        var row=Array.isArray(rawRows[r])?rawRows[r].map(toStr):[];
        while(row.length<headers.length) row.push('');
        if(row.length>headers.length) row=row.slice(0,headers.length);
        rows.push(row);
      }
      if(!rows.length){
        var blank=[];
        for(var z=0;z<headers.length;z++) blank.push('');
        rows.push(blank);
      }
      books.push({
        id:toStr(b.id)||('bk_'+i+'_'+j),
        name:toStr(b.name)||'未命名单词本',
        headers:headers,types:types,groups:groups,rows:rows,ebboff:ebboff,ebbStart:normalizeDate(b.ebbStart),v:SCHEMA_V
      });
    }
    cats.push({id:toStr(c.id)||('ct_'+i),name:toStr(c.name)||'未命名分类',books:books});
  }
  if(!cats.length) return null;
  var active=raw.active||null;
  var found=false;
  cats.forEach(function(c){ c.books.forEach(function(b){ if(b.id===active) found=true; }); });
  if(!found) active=firstBookIdOf(cats);
  var openCat=raw.openCat||null;
  var openOk=false;
  cats.forEach(function(c){ if(c.id===openCat) openOk=true; });
  return {cats:cats,active:active,mask:!!raw.mask,ipa:(typeof raw.ipa==='boolean'?raw.ipa:true),theme:(['t1','t2','t3','t4','t5'].indexOf(raw.theme)>=0?raw.theme:'t1'),font:(['def','serif','kai','round','mono'].indexOf(raw.font)>=0?raw.font:'def'),openCat:openOk?openCat:null};
}

function firstBookIdOf(cats){

function cleanMeaningString(v){
  var s=toSimplified(toStr(v));
  return s.split('\n').map(function(line){
    var m=line.match(/^\s*(adj|adv|n|v|vt|vi|prep|conj|pron|num|art|int|phr|aux)\.\s*/i);
    var prefix=m?m[0]:'';
    var body=m?line.slice(m[0].length):line;
    var seen=[];
    body.split(/[；;]/).forEach(function(g){
      g=g.trim();
      if(g&&seen.indexOf(g)<0) seen.push(g);
    });
    return prefix+seen.join('；');
  }).join('\n');
}
function simplifyWorkspace(st){
  var changed=false;
  st.cats.forEach(function(cat){
    cat.books.forEach(function(b){
      var idxs=[];
      for(var c=0;c<b.types.length;c++){ if(b.types[c]==='meaning') idxs.push(c); }
      if(!idxs.length||!Array.isArray(b.rows)) return;
      b.rows.forEach(function(row){
        idxs.forEach(function(c){
          var v=toStr(row[c]);
          var nv=cleanMeaningString(v);
          if(nv!==v){ row[c]=nv; changed=true; }
        });
      });
    });
  });
  return changed;
}

      }else{
        var isWord=(k===0);
        var ipaText=(isWord&&state.ipa)?ipaLookup(b.rows[r][k]):'';
        out+='<div class="cell'+(isWord?' is-word':'')+(masked?' is-masked':'')+'" data-r="'+r+'" data-c="'+k+'">';

        if(ipaText) out+='<span class="ipa">'+esc(ipaText)+'</span>';
        if(masked) out+=veilHTML();

      }
    }
  }

}

var ipaCache={},ipaTried={},ipaPending={},ipaTimers={},ipaQueue=[],ipaQueueTimer=null,kickTimer=null;
/* 词典接口缺音标时的内置兜底，键为小写单词 */
var IPA_FALLBACK={
  attribute:'/əˈtrɪbjuːt/'
};
try{
  var ipaRaw=window.localStorage.getItem('dc_ipa_v2');
  if(ipaRaw){
    var ipaParsed=JSON.parse(ipaRaw);
    if(ipaParsed&&typeof ipaParsed==='object') ipaCache=ipaParsed;
  }else{
    /* 从旧版缓存迁移：只保留非空音标，丢弃空值（如 attribute 的空记录） */
    var oldRaw=window.localStorage.getItem('dc_ipa_v1');
    if(oldRaw){
      var oldParsed=JSON.parse(oldRaw);
      if(oldParsed&&typeof oldParsed==='object'){
        for(var oldKey in oldParsed){ if(oldParsed[oldKey]) ipaCache[oldKey]=oldParsed[oldKey]; }
      }
      saveIpaCache();
      window.localStorage.removeItem('dc_ipa_v1');
    }
  }
}catch(e){ ipaCache={}; }

function ipaKey(word){ return toStr(word).trim().toLowerCase(); }
function ipaLookup(word){
  var k=ipaKey(word);
  if(!k) return '';
  return ipaCache[k]||IPA_FALLBACK[k]||'';
}
function saveIpaCache(){
  if(!canStore) return;
  try{ window.localStorage.setItem('dc_ipa_v2',JSON.stringify(ipaCache)); }catch(e){}
}
function extractIpa(data){
  if(!Array.isArray(data)) return '';
  for(var i=0;i<data.length;i++){
    var en=data[i]||{};
    if(en.phonetic) return en.phonetic;
    var ph=en.phonetics||[];
    for(var j=0;j<ph.length;j++){ if(ph[j]&&ph[j].text) return ph[j].text; }
  }
  return '';
}
function applyIpa(r,c,ipa,word){
  if(!state.ipa) return;
  var ref=activeRef();
  if(!ref) return;
  var cell=elMain.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
  if(!cell) return;
  var inp=cell.querySelector('input');
  if(inp&&ipaKey(inp.value)!==ipaKey(word)) return;
  var span=cell.querySelector('.ipa');
  if(!ipa){
    if(span&&span.parentNode) span.parentNode.removeChild(span);
    return;
  }
  if(!span){
    span=document.createElement('span');
    span.className='ipa';
    var veil=cell.querySelector('.veil');
    if(veil){ cell.insertBefore(span,veil); }else{ cell.appendChild(span); }
  }
  span.textContent=ipa;
}
function lookupIpa(r,c,word){
  var k=ipaKey(word);
  if(!k||!window.fetch){ return; }
  if(ipaCache[k]!==undefined){ applyIpa(r,c,ipaCache[k],word); return; }
  if(ipaPending[k]) return;
  ipaPending[k]=true;
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(k))
    .then(function(res){ if(!res.ok) throw new Error('http '+res.status); return res.json(); })
    .then(function(data){
      var ipa=extractIpa(data)||IPA_FALLBACK[k]||'';
      ipaTried[k]=true;
      ipaCache[k]=ipa;
      saveIpaCache();
      if(state.ipa) applyIpa(r,c,ipa,word);
    })
    .catch(function(){
      ipaTried[k]=true;
      if(IPA_FALLBACK[k]){
        ipaCache[k]=IPA_FALLBACK[k];
        saveIpaCache();
        if(state.ipa) applyIpa(r,c,IPA_FALLBACK[k],word);
      }
    })
    .then(function(){ ipaPending[k]=false; });
}
function scheduleIpa(r,c,word){
  if(ipaTimers[r]) clearTimeout(ipaTimers[r]);
  if(!ipaKey(word)){ applyIpa(r,c,'',word); return; }
  ipaTimers[r]=setTimeout(function(){ ipaTimers[r]=null; lookupIpa(r,c,word); },700);
}
function kickIpaQueue(){
  if(!state.ipa) return;
  var ref=activeRef();
  if(!ref) return;
  ipaQueue=[];
  var b=ref.book;
  for(var r=0;r<b.rows.length&&ipaQueue.length<60;r++){
    var w=toStr(b.rows[r][0]).trim();
    var k=ipaKey(w);
    if(!k) continue;
    if(ipaCache[k]!==undefined||ipaTried[k]||ipaPending[k]) continue;
    ipaQueue.push({r:r,w:w});
  }
  pumpIpaQueue();
}
function pumpIpaQueue(){
  if(ipaQueueTimer){ clearTimeout(ipaQueueTimer); ipaQueueTimer=null; }
  if(!state.ipa||!ipaQueue.length) return;
  var job=ipaQueue.shift();
  lookupIpa(job.r,0,job.w);
  ipaQueueTimer=setTimeout(pumpIpaQueue,300);
}
function scheduleKick(){
  if(kickTimer) clearTimeout(kickTimer);
  kickTimer=setTimeout(function(){ kickTimer=null; kickIpaQueue(); },400);
}

  if(mRaw){
    var mParsed=JSON.parse(mRaw);
    if(mParsed&&typeof mParsed==='object') meaningCache=mParsed;
  }else{
    /* 旧版缓存迁移：统一转简体，丢弃无法转换的空值 */
    var oldMRaw=window.localStorage.getItem('dc_meaning_v1');
    if(oldMRaw){
      var oldMParsed=JSON.parse(oldMRaw);
      if(oldMParsed&&typeof oldMParsed==='object'){
        for(var oldMKey in oldMParsed){
          if(oldMParsed[oldMKey]) meaningCache[oldMKey]=toSimplified(oldMParsed[oldMKey]);
        }
      }
      window.localStorage.removeItem('dc_meaning_v1');
    }
  }
}catch(e){ meaningCache={}; }
function saveMeaningCache(){
  if(!canStore) return;
  try{ window.localStorage.setItem('dc_meaning_v2',JSON.stringify(meaningCache)); }catch(e){}
}
var POS_MAP={verb:'v.',noun:'n.',adjective:'adj.',adverb:'adv.',preposition:'prep.',conjunction:'conj.',pronoun:'pron.',numeral:'num.',interjection:'int.',exclamation:'int.'};
function fetchPosList(k){
  if(!window.fetch) return Promise.resolve([]);
  return fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(k))
    .then(function(res){ if(!res.ok) throw new Error(); return res.json(); })
    .then(function(data){
      var set=[];
      if(Array.isArray(data)){
        data.forEach(function(en){
          (en.meanings||[]).forEach(function(m){
            var p=POS_MAP[m.partOfSpeech];
            if(p&&set.indexOf(p)<0) set.push(p);
          });
        });
      }
      return set;
    })
    .catch(function(){ return []; });
}
function hasCJK(s){ return /[一-鿿]/.test(s); }
function parseTranslationText(str){
  var pos='';
  var s=toStr(str).trim();
  var m=s.match(/^\s*(adj|adv|n|v|vt|vi|prep|conj|pron|num|art|int)\.\s*/i);
  if(m){ pos=m[1].toLowerCase()+'.'; s=s.slice(m[0].length); }
  var parts=s.split(/[,，、;；\/]\s*/);
  var out=[];
  for(var i=0;i<parts.length;i++){
    var x=toSimplified(parts[i].replace(/\s+/g,'').trim());
    if(!x||!hasCJK(x)) continue;
    if(out.indexOf(x)<0) out.push(x);
    if(out.length>=3) break;
  }
  return {pos:pos,glosses:out};
}
function parseMyMeaning(data){
  var pool=[];
  if(data&&data.responseData&&data.responseData.translatedText) pool.push(data.responseData.translatedText);
  if(data&&Array.isArray(data.matches)){
    data.matches.forEach(function(m){ if(m&&m.translation) pool.push(m.translation); });
  }
  var glosses=[],pos='';
  for(var i=0;i<pool.length;i++){
    var r=parseTranslationText(pool[i]);
    if(r.pos&&!pos) pos=r.pos;
    for(var j=0;j<r.glosses.length;j++){
      if(glosses.indexOf(r.glosses[j])<0) glosses.push(r.glosses[j]);
    }
  }
  if(glosses.length>3) glosses=glosses.slice(0,3);
  return {pos:pos,glosses:glosses};
}
function withTimeout(p,ms){
  return Promise.race([p,new Promise(function(res){ setTimeout(function(){res(null);},ms); })]);
}
function buildMeaningString(k){
  if(AUTO_MEANING[k]) return Promise.resolve(toSimplified(AUTO_MEANING[k]));
  if(!window.fetch) return Promise.resolve('');
  return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(k)+'&langpair=en|zh-CN')
    .then(function(res){ if(!res.ok) throw new Error(); return res.json(); })
    .then(parseMyMeaning)
    .catch(function(){ return {pos:'',glosses:[]}; })
    .then(function(r){
      if(!r.glosses.length) return '';
      if(r.pos) return toSimplified(r.pos+' '+r.glosses.join('；'));
      return withTimeout(fetchPosList(k),6000).then(function(posList){
        return toSimplified(((posList&&posList[0])||'')+' '+r.glosses.join('；'));
      });
    });
}
function fillMeaning(r,k,word){
  var ref=activeRef();
  if(!ref) return;
  var b=ref.book;
  var mc=b.types.indexOf('meaning');
  if(mc<0||!b.rows[r]) return;
  var inp=elMain.querySelector('.cell.is-word input[data-r="'+r+'"]');
  if(inp&&ipaKey(inp.value)!==k) return;
  if(toStr(b.rows[r][mc]).trim()) return;
  b.rows[r][mc]=word;
  save();
  var cell=elMain.querySelector('.cell.is-meaning[data-r="'+r+'"][data-c="'+mc+'"]');
  if(cell){
    cell.classList.remove('is-masked');
    cell.innerHTML=meaningCellInner(word);
  }
}
function lookupMeaning(r,word){
  var k=ipaKey(word);
  if(!k) return;
  var ref=activeRef();
  if(!ref) return;
  var mc=ref.book.types.indexOf('meaning');
  if(mc<0||!ref.book.rows[r]) return;
  if(toStr(ref.book.rows[r][mc]).trim()) return;
  if(meaningCache[k]!==undefined){ if(meaningCache[k]) fillMeaning(r,k,meaningCache[k]); return; }
  if(meaningPending[k]) return;
  meaningPending[k]=true;
  buildMeaningString(k).then(function(str){
    meaningPending[k]=false;
    if(str){ meaningCache[k]=str; saveMeaningCache(); fillMeaning(r,k,str); }
  }).catch(function(){ meaningPending[k]=false; });
}
function scheduleMeaning(r,word){
  if(meaningTimers[r]) clearTimeout(meaningTimers[r]);
  if(!ipaKey(word)) return;
  meaningTimers[r]=setTimeout(function(){ meaningTimers[r]=null; lookupMeaning(r,word); },900);
}

/* ===== 轻提示 ===== */
var toastEl=null,toastTimer=null;
function toast(msg){
  if(!toastEl){
    toastEl=document.createElement('div');
    toastEl.className='toast';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); },1800);
}

var sheetEl=null;
function closeSheet(){
  var el=sheetEl;
  sheetEl=null;
  if(el&&el.parentNode) el.parentNode.removeChild(el);
  if(el&&typeof el._ondismiss==='function') el._ondismiss();
}
function openSheet(title,sub,items){
  closeSheet();
  var wrap=document.createElement('div');
  wrap.className='sheet-wrap';
  var html='<div class="sheet-bg" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true">';
  html+='<div class="sheet-handle"></div>';
  html+='<h2 class="sheet-title">'+esc(title)+'</h2>';
  if(sub) html+='<p class="sheet-sub">'+esc(sub)+'</p>';
  html+='<div class="sheet-list">';
  for(var i=0;i<items.length;i++){
    var it=items[i];
    html+='<button type="button" class="sheet-item'+(it.danger?' danger':'')+'" data-idx="'+i+'"><span class="si-label">'+esc(it.label)+'</span>'+(it.desc?'<span class="si-desc">'+esc(it.desc)+'</span>':'')+'</button>';
  }
  html+='</div><button type="button" class="sheet-cancel" data-close="1">取消</button></div>';
  wrap.innerHTML=html;
  document.body.appendChild(wrap);
  wrap.addEventListener('click',function(e){
    var t=e.target;
    if(t.closest('[data-close]')){ closeSheet(); return; }
    var item=t.closest('.sheet-item');
    if(!item) return;
    var idx=parseInt(item.getAttribute('data-idx'),10);
    var fn=items[idx]&&items[idx].onClick;
    closeSheet();
    if(fn) setTimeout(fn,0);
  });

}

function openMeaningEditor(r,c){
  var ref=activeRef();
  if(!ref) return;
  var b=ref.book;
  var entries=parseEntries(b.rows[r][c]);
  var word=toStr(b.rows[r][0]).trim();
  closeSheet();

  var wrap=document.createElement('div');
  wrap.className='sheet-wrap';
  wrap.innerHTML='<div class="sheet-bg" data-close="1"></div>'+
    '<div class="sheet sheet-tall" role="dialog" aria-modal="true">'+
      '<div class="sheet-handle"></div>'+
      '<h2 class="sheet-title">释义'+(word?' · '+esc(word):'')+'</h2>'+
      '<p class="sheet-sub">先选词性，再写中文意思；可以连续添加多条</p>'+
      '<div class="ms-scroll"></div>'+
      '<p class="ms-label">选择词性，添加一条</p>'+
      '<div class="ms-chips"></div>'+
      '<div class="sheet-foot"><button type="button" class="btn primary block" data-close="1">完成</button></div>'+
    '</div>';
  document.body.appendChild(wrap);
  sheetEl=wrap;

  var listEl=wrap.querySelector('.ms-scroll');
  var chipsEl=wrap.querySelector('.ms-chips');

  function commit(){
    var clean=[];
    for(var i=0;i<entries.length;i++){
      if(toStr(entries[i].text).trim()) clean.push(entries[i]);
    }
    b.rows[r][c]=serializeEntries(clean);
    save();
    refreshCell(r,c);
  }
  function renderList(){
    if(!entries.length){
      listEl.innerHTML='<p class="ms-empty">还没有释义，从下面选一个词性开始。</p>';
      return;
    }
    var html='';
    for(var i=0;i<entries.length;i++){
      html+='<div class="ms-row"><select class="ms-pos" data-i="'+i+'" aria-label="词性">'+posOptions(entries[i].pos)+'</select>'+
        '<input class="ms-input" data-i="'+i+'" type="text" maxlength="40" autocomplete="off" value="'+esc(entries[i].text)+'" placeholder="写中文意思">'+
        '<button type="button" class="ms-del" data-del="'+i+'" aria-label="删除这条">×</button></div>';
    }
    listEl.innerHTML=html;
  }
  function renderChips(){
    var html='';
    for(var i=0;i<POS_LIST.length;i++){
      html+='<button type="button" class="chip" data-pos="'+esc(POS_LIST[i].v)+'">'+esc(POS_LIST[i].t)+'</button>';
    }
    chipsEl.innerHTML=html;
  }
  renderList();
  renderChips();

  wrap.addEventListener('click',function(e){
    var t=e.target;
    if(t.closest('[data-close]')){ commit(); closeSheet(); return; }
    var del=t.closest('[data-del]');
    if(del){
      var di=parseInt(del.getAttribute('data-del'),10);
      entries.splice(di,1);
      renderList();
      commit();
      return;
    }
    var chip=t.closest('[data-pos]');
    if(chip){
      entries.push({pos:chip.getAttribute('data-pos'),text:''});
      renderList();
      commit();
      var ins=listEl.querySelectorAll('.ms-input');
      if(ins.length){
        ins[ins.length-1].focus();
        if(listEl.scrollHeight) listEl.scrollTop=listEl.scrollHeight;
      }
      return;
    }
  });
  wrap.addEventListener('input',function(e){
    var t=e.target;
    if(!t.classList||!t.classList.contains('ms-input')) return;
    var i=parseInt(t.getAttribute('data-i'),10);
    if(entries[i]){ entries[i].text=t.value; commit(); }
  });
  wrap.addEventListener('change',function(e){
    var t=e.target;
    if(!t.classList||!t.classList.contains('ms-pos')) return;
    var i=parseInt(t.getAttribute('data-i'),10);
    if(entries[i]){ entries[i].pos=t.value; commit(); }
  });
  wrap._ondismiss=function(){
    if(!state.mask) return;
    if(c!==maskIndex()) return;
    var cell=elMain.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');
    if(cell&&!cell.querySelector('.veil')){
      var v=document.createElement('span');
      v.className='veil';
      v.setAttribute('aria-hidden','true');
      v.innerHTML='<span>···</span>';
      cell.appendChild(v);
    }
  };
}

  if(ref.book.rows.length>=MAX_ROWS){ toast('最多 '+MAX_ROWS+' 行'); return; }

/* ===== 打卡表日期 ===== */
function todayISO(){
  var d=new Date();
  var mo=d.getMonth()+1, da=d.getDate();
  return d.getFullYear()+'-'+(mo<10?'0':'')+mo+'-'+(da<10?'0':'')+da;
}
function normalizeDate(s){
  if(typeof s!=='string') return null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  return s;
}
function addDaysISO(iso,n){
  var y=parseInt(iso.slice(0,4),10), mo=parseInt(iso.slice(5,7),10), da=parseInt(iso.slice(8,10),10);
  if(isNaN(y)||isNaN(mo)||isNaN(da)) return null;
  var t=Date.UTC(y,mo-1,da)+Number(n)*86400000;
  var d=new Date(t);
  return {m:d.getUTCMonth()+1,d:d.getUTCDate()};
}
function ebbDateLabel(b,c){
  var start=normalizeDate(b.ebbStart);
  if(!start) return '';
  var off=b.ebboff?b.ebboff[c]:null;
  if(typeof off!=='number'||isNaN(off)) return '';
  var r=addDaysISO(start,off);
  if(!r) return '';
  return r.m+'/'+r.d;
}

    '<div class="sheet-actions"><button type="button" class="btn ghost" data-today="1">用今天</button><button type="button" class="btn primary" data-ok="1">确定</button></div>'+
    '<button type="button" class="ebb-remove" data-remove="1">移除整张打卡表</button>'+
    '</div>';
  document.body.appendChild(wrap);
  sheetEl=wrap;
  var inp=wrap.querySelector('.date-input');

    var t=e.target;

      saveNow(); closeSheet(); render(true);

    }
  });
}

function removeEbb(){
  var ref=activeRef();
  if(!ref) return;
  var b=ref.book;
  var keep=[];
  for(var c=0;c<b.headers.length;c++){ if(b.types[c]!=='check') keep.push(c); }
  if(keep.length===b.headers.length){ toast('当前没有打卡表'); return; }
  var nh=[],nt=[],ng=[],ne=[],nrows=[];
  for(var k=0;k<keep.length;k++){
    var idx=keep[k];
    nh.push(b.headers[idx]); nt.push(b.types[idx]); ng.push(b.groups[idx]); ne.push(b.ebboff[idx]);
  }
  for(var r=0;r<b.rows.length;r++){
    var nr=[];
    for(var k2=0;k2<keep.length;k2++){
      var v=b.rows[r][keep[k2]];
      nr.push(v===undefined?'':v);
    }
    nrows.push(nr);
  }
  b.headers=nh; b.types=nt; b.groups=ng; b.ebboff=ne; b.rows=nrows; b.ebbStart=null;
  saveNow(); render(true);
  toast('已移除打卡表');
}

/* ===== 分类与单词本操作 ===== */
function newCategory(){
  openInput({
    title:'新建分类',
    sub:'分类用来收纳同一类单词本',
    value:'',
    placeholder:'例如：考研词汇 / 四级核心 / 生词本',
    okText:'创建',
    onSubmit:function(v){
      var cat={id:uid('ct_'),name:v,books:[]};
      state.cats.push(cat);
      state.openCat=cat.id;
      saveNow(); render(false); openDrawer();
      toast('已创建分类「'+v+'」');
    }
  });
}

function newBook(catId){
  var cat=findCat(catId);
  if(!cat) return;
  openInput({
    title:'新建单词本',
    sub:'分类：'+cat.name,
    value:'',
    placeholder:'例如：Unit 1 / 高频 100 词',
    okText:'创建',
    onSubmit:function(v){
      var rows=[];
      for(var i=0;i<15;i++) rows.push(['','']);
      var book={
        id:uid('bk_'),name:v,
        headers:['单词','释义'],
        types:['text','meaning'],
        groups:['',''],
        ebboff:[null,null],
        ebbStart:null,
        rows:rows,v:SCHEMA_V
      };
      cat.books.push(book);
      state.active=book.id;
      saveNow(); render(false); closeDrawer();
      toast('已新建 15 行 × 2 列的单词本');
    }
  });
}

function renameCategory(catId){
  var cat=findCat(catId);
  if(!cat) return;
  openInput({
    title:'重命名分类',
    value:cat.name,
    okText:'保存',
    onSubmit:function(v){ cat.name=v; saveNow(); render(false); }
  });
}

function deleteCategory(catId){
  var cat=findCat(catId);
  if(!cat) return;
  var hadActive=false;
  cat.books.forEach(function(b){ if(b.id===state.active) hadActive=true; });
  var idx=state.cats.indexOf(cat);
  if(idx>=0) state.cats.splice(idx,1);
  if(hadActive) state.active=firstBookId();
  if(state.openCat===catId) state.openCat=null;
  saveNow(); render(false);
  toast('已删除分类');
}

function renameBook(bookId){
  var book=null,parent=null;
  state.cats.forEach(function(c){ c.books.forEach(function(b){ if(b.id===bookId){ book=b; parent=c; } }); });
  if(!book) return;
  openInput({
    title:'重命名单词本',
    sub:parent?('分类：'+parent.name):'',
    value:book.name,
    okText:'保存',
    onSubmit:function(v){ book.name=v; saveNow(); render(false); }
  });
}

function deleteBook(bookId){
  var book=null,parent=null;
  state.cats.forEach(function(c){ c.books.forEach(function(b){ if(b.id===bookId){ book=b; parent=c; } }); });
  if(!book||!parent) return;
  var idx=parent.books.indexOf(book);
  if(idx>=0) parent.books.splice(idx,1);
  if(state.active===bookId) state.active=firstBookId();
  saveNow(); render(false);
  toast('已删除单词本');
}

/* ===== 主题 / 字体 / 朗读 ===== */
var THEMES=[
  {id:'t1',name:'墨金（默认）',c1:'#E0A02E',c2:'#16271F'},
  {id:'t2',name:'黄蓝',c1:'#F9D77C',c2:'#8DA6D2'},
  {id:'t3',name:'粉青',c1:'#F2B6B6',c2:'#6A90A6'},
  {id:'t4',name:'青绿',c1:'#A9D8B7',c2:'#7BBFCF'},
  {id:'t5',name:'粉紫',c1:'#F5B89E',c2:'#B8A6D3'}
];
var FONTS=[
  {id:'def',name:'默认 · 正文无衬线',cls:'f-def'},
  {id:'serif',name:'宋体 · 全衬线',cls:'f-serif'},
  {id:'kai',name:'楷体 · 手写感',cls:'f-kai'},
  {id:'round',name:'圆体 · 柔和',cls:'f-round'},
  {id:'mono',name:'等宽 · 打字机',cls:'f-mono'}
];
function applyTheme(){
  document.documentElement.setAttribute('data-theme',state.theme||'t1');
  document.documentElement.setAttribute('data-font',state.font||'def');
  try{
    var meta=document.querySelector('meta[name="theme-color"]');
    var ink=getComputedStyle(document.documentElement).getPropertyValue('--ink');
    if(meta&&ink) meta.setAttribute('content',ink.trim());
  }catch(e){}
}
function openSettings(){
  if(sheetEl) closeSheet();
  var th='';
  for(var i=0;i<THEMES.length;i++){
    var t=THEMES[i];
    th+='<button type="button" class="theme-chip'+(state.theme===t.id?' is-on':'')+(t.id==='t1'?' wide':'')+'" data-theme="'+t.id+'">'+
        '<span class="sw"><i style="background:'+t.c1+'"></i><i style="background:'+t.c2+'"></i></span>'+
        '<b>'+t.name+'</b></button>';
  }
  var fh='';
  for(var j=0;j<FONTS.length;j++){
    var f=FONTS[j];
    fh+='<button type="button" class="font-item'+(state.font===f.id?' is-on':'')+'" data-font="'+f.id+'">'+
        '<b class="fx '+f.cls+'">alternative</b><span class="fname">'+f.name+'</span><span class="fdot"></span></button>';
  }
  var wrap=document.createElement('div');
  wrap.className='sheet-wrap';
  wrap.innerHTML='<div class="sheet-bg" data-close="1"></div>'+
    '<div class="sheet sheet-full" role="dialog" aria-modal="true">'+
      '<div class="sheet-handle"></div>'+
      '<h2 class="sheet-title">设置</h2>'+
      '<p class="sheet-sub">点一下即时生效，自动保存</p>'+
      '<div class="set-body">'+
        '<h3 class="set-h">主题配色</h3><div class="theme-grid">'+th+'</div>'+
        '<h3 class="set-h">字体</h3><div class="font-list">'+fh+'</div>'+
      '</div>'+
      '<div class="done-wrap"><button type="button" class="btn primary block" data-close="1">完成</button></div>'+
    '</div>';
  document.body.appendChild(wrap);
  sheetEl=wrap;
  wrap.addEventListener('click',function(e){
    var chip=e.target.closest('.theme-chip');
    if(chip){
      state.theme=chip.getAttribute('data-theme');
      applyTheme(); saveNow();
      var chips=wrap.querySelectorAll('.theme-chip');
      for(var k=0;k<chips.length;k++) chips[k].classList.toggle('is-on',chips[k].getAttribute('data-theme')===state.theme);
      return;
    }
    var fi=e.target.closest('.font-item');
    if(fi){
      state.font=fi.getAttribute('data-font');
      applyTheme(); saveNow();
      var items=wrap.querySelectorAll('.font-item');
      for(var m=0;m<items.length;m++) items[m].classList.toggle('is-on',items[m].getAttribute('data-font')===state.font);
      return;
    }
    if(e.target.closest('[data-close]')){ closeSheet(); closeDrawer(); }
  });
}
var lastSpeakAt=0;
function speakWord(word){
  var w=toStr(word).trim();
  if(!w||!window.speechSynthesis) return;
  w=w.replace(/[^A-Za-z' \-]/g,'');
  if(!w) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(w);
    u.lang='en-US';u.rate=0.95;u.pitch=1;
    var vs=window.speechSynthesis.getVoices()||[];
    var v=null;
    for(var i=0;i<vs.length;i++){ if(/en[-_]US/i.test(vs[i].lang)){ v=vs[i]; break; } }
    if(!v){ for(var j=0;j<vs.length;j++){ if(/^en/i.test(vs[j].lang)){ v=vs[j]; break; } } }
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

btnMenu.addEventListener('click',openDrawer);
btnDrawerClose.addEventListener('click',closeDrawer);
elScrim.addEventListener('click',closeDrawer);
btnNewCat.addEventListener('click',newCategory);

btnMore.addEventListener('click',function(){
  var ref=activeRef();
  if(!ref) return;
  openSheet(ref.book.name,'分类：'+ref.cat.name,[
    {label:'重命名单词本',onClick:function(){ renameBook(ref.book.id); }},
    {label:'删除单词本',desc:'不可恢复',danger:true,onClick:function(){
      openSheet('删除「'+ref.book.name+'」？','这本单词本的所有内容会被移除',[
        {label:'确认删除',danger:true,onClick:function(){ deleteBook(ref.book.id); }}
      ]);
    }}

elToolbar.addEventListener('click',function(e){
  var btn=e.target.closest('[data-act]');
  if(!btn) return;
  var act=btn.getAttribute('data-act');
  if(act==='addrow') addRow();
  else if(act==='addcol') addCol();
  else if(act==='ipa'){
    state.ipa=!state.ipa;
    saveNow(); render(true);
    toast(state.ipa?'已显示音标':'已隐藏音标');
    if(state.ipa) scheduleKick();
  }
  else if(act==='mask'){
    state.mask=!state.mask;
    saveNow(); render(true);
    toast(state.mask?'已遮挡最后一列，点格子即可查看':'已显示全部内容');
  }
});

elMain.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest('.ipa')){
    var ipaCell=t.closest('.cell');
    var ipaInput=ipaCell?ipaCell.querySelector('input'):null;
    if(ipaInput&&toStr(ipaInput.value).trim()){ lastSpeakAt=Date.now(); speakWord(ipaInput.value); }
    return;
  }
  var veil=t.closest('.veil');
  if(veil){
    var vcell=veil.parentNode;
    if(vcell) vcell.classList.remove('is-masked');
    if(veil.parentNode) veil.parentNode.removeChild(veil);
    return;
  }
  var cell=t.closest('.cell');
  if(cell){
    var r=parseInt(cell.getAttribute('data-r'),10);
    var c=parseInt(cell.getAttribute('data-c'),10);
    var ref=activeRef();
    if(ref&&!isNaN(r)&&!isNaN(c)){
      if(ref.book.types[c]==='check'){ toggleCheck(r,c); return; }
      if(ref.book.types[c]==='meaning'){ openMeaningEditor(r,c); return; }
    }
  }
  var rail=t.closest('.rrail');
  if(rail){ rowSheet(parseInt(rail.getAttribute('data-r'),10)); return; }
  var head=t.closest('.chead');
  if(head){
    var hc=parseInt(head.getAttribute('data-c'),10);
    var href=activeRef();
    if(href&&href.book.types[hc]==='check'){ openEbbSheet(); }
    else{ colSheet(hc); }
    return;
  }
  var actBtn=t.closest('[data-act]');
  if(actBtn){
    var a=actBtn.getAttribute('data-act');
    if(a==='newcat') newCategory();
    else if(a==='opendrawer') openDrawer();
    return;
  }
});

elMain.addEventListener('input',function(e){
  var t=e.target;
  if(!t||t.tagName!=='INPUT') return;
  var ref=activeRef();
  if(!ref) return;
  var r=parseInt(t.getAttribute('data-r'),10);
  var c=parseInt(t.getAttribute('data-c'),10);
  if(isNaN(r)||isNaN(c)) return;
  if(!ref.book.rows[r]) return;
  ref.book.rows[r][c]=t.value;
  save();
  if(c===0){ scheduleIpa(r,c,t.value); scheduleMeaning(r,t.value); }
});

elMain.addEventListener('focusin',function(e){
  var t=e.target;
  if(!t||t.tagName!=='INPUT') return;
  if(t.getAttribute('data-c')!=='0') return;
  var w=toStr(t.value).trim();
  if(!w) return;
  if(Date.now()-lastSpeakAt<900) return;
  lastSpeakAt=Date.now();
  speakWord(w);
});

elMain.addEventListener('focusout',function(e){
  var t=e.target;
  if(!t||t.tagName!=='INPUT'||!state.mask) return;
  var ref=activeRef();
  if(!ref) return;
  var c=parseInt(t.getAttribute('data-c'),10);
  if(c!==maskIndex()) return;
  setTimeout(function(){
    var cell=t.parentNode;
    if(!cell||!cell.classList||cell.classList.contains('is-masked')) return;
    var active=document.activeElement;
    if(active&&active.parentNode===cell) return;
    cell.classList.add('is-masked');
    var v=document.createElement('span');
    v.className='veil';
    v.setAttribute('aria-hidden','true');
    v.innerHTML='<span>···</span>';
    cell.appendChild(v);
  },0);
});

elDrawerBody.addEventListener('click',function(e){
  var t=e.target;
  var catBtn=t.closest('.cat-row');
  if(catBtn){
    var cid=catBtn.getAttribute('data-cat');
    state.openCat=(state.openCat===cid)?null:cid;
    save();
    renderDrawer();
    return;
  }
  var catMenu=t.closest('[data-catmenu]');
  if(catMenu){
    var id=catMenu.getAttribute('data-catmenu');
    var cat=findCat(id);
    if(!cat) return;
    openSheet(cat.name,cat.books.length+' 本单词本',[
      {label:'在这个分类下新建单词本',onClick:function(){ newBook(id); }},
      {label:'重命名分类',onClick:function(){ renameCategory(id); }},
      {label:'删除分类',desc:'含全部单词本',danger:true,onClick:function(){
        openSheet('删除分类「'+cat.name+'」？','分类下的 '+cat.books.length+' 本单词本会一起被删除，不可恢复',[
          {label:'确认删除',danger:true,onClick:function(){ deleteCategory(id); }}
        ]);
      }}
    ]);
    return;
  }
  var bookBtn=t.closest('.book');
  if(bookBtn){
    state.active=bookBtn.getAttribute('data-book');
    saveNow();
    closeDrawer();
    render(false);
    return;
  }
  var bookMenu=t.closest('[data-bookmenu]');
  if(bookMenu){
    var bid=bookMenu.getAttribute('data-bookmenu');
    var target=null,parentCat=null;
    state.cats.forEach(function(c){ c.books.forEach(function(b){ if(b.id===bid){ target=b; parentCat=c; } }); });
    if(!target) return;
    openSheet(target.name,parentCat?('分类：'+parentCat.name):'',[
      {label:'重命名单词本',onClick:function(){ renameBook(bid); }},
      {label:'删除单词本',desc:'不可恢复',danger:true,onClick:function(){
        openSheet('删除「'+target.name+'」？','这本单词本的所有内容会被移除',[
          {label:'确认删除',danger:true,onClick:function(){ deleteBook(bid); }}
        ]);
      }}
    ]);
    return;
  }
  var addBtn=t.closest('[data-addbook]');
  if(addBtn){ newBook(addBtn.getAttribute('data-addbook')); return; }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if(sheetEl) closeSheet(); else closeDrawer(); }
});
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') saveNow(); });

applyTheme();
/* 移除平台注入的“豆包AI生成”悬浮水印，并拦截后续注入 */
function dropWatermark(root){
  if(!root||!root.querySelectorAll) return;
  var nodes=root.querySelectorAll('[data-custom-element="doubao-watermark"]');
  for(var i=0;i<nodes.length;i++){ if(nodes[i].parentNode) nodes[i].parentNode.removeChild(nodes[i]); }
}
dropWatermark(document);
if(window.MutationObserver){
  var wmObserver=new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var added=muts[i].addedNodes;
      for(var j=0;j<added.length;j++){
        var node=added[j];
        if(node.nodeType===1){
          if(node.getAttribute&&node.getAttribute('data-custom-element')==='doubao-watermark'){
            if(node.parentNode) node.parentNode.removeChild(node);
          }else{ dropWatermark(node); }
        }
      }
    }
  });
  wmObserver.observe(document.documentElement,{childList:true,subtree:true});
}
render(false);
})();
